[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "uav-planner"
version = "1.0.0"
description = "Terrain-aware UAV mission planning: A*, Theta* and RRT* over elevation data with QGroundControl export."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bekirhan Karakurt" }]
keywords = ["uav", "drone", "mission-planning", "path-planning", "mavlink", "srtm"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "numpy"]
test = ["pytest>=7"]

[project.scripts]
uav-planner = "uav_planner.cli:main"

[project.urls]
Homepage = "https://github.com/bekirhankarakurt/uav-mission-planner"
Issues = "https://github.com/bekirhankarakurt/uav-mission-planner/issues"

[tool.scikit-build]
cmake.version = ">=3.16"
wheel.packages = ["python/uav_planner"]
sdist.include = ["include", "src", "cli", "tests", "python", "CMakeLists.txt", "LICENSE", "README.md"]

[tool.scikit-build.cmake.define]
UAV_BUILD_PYTHON = "ON"
UAV_BUILD_CLI = "OFF"
UAV_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
